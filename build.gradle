plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

group = mod_group
version = mod_version

base {
    archivesName = "${mod_id}-1.7.10"
}

// O Minecraft 1.7.10 roda em Java 8
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Teste automático com capturas de tela (só desenvolvimento): gradlew runClient -Pautotest=true
def autotest = (project.findProperty('autotest') ?: 'false').toString().toBoolean()

minecraft {
    mcVersion = '1.7.10'
    username = 'Desenvolvedor'
    extraRunJvmArguments.add("-ea:${project.group}")
    extraRunJvmArguments.add("-Dtelescopio.autotest=${autotest}")
}

if (autotest) {
    tasks.named('runClient').configure {
        args '--width', '1280', '--height', '720'
    }
}

// o código do teste automático não vai para o .jar distribuído
// (no teste ele precisa estar no jar, porque o runClient do RFG carrega o mod a partir dele)
if (!autotest) {
    tasks.named('jar', Jar).configure {
        exclude 'com/modtelescopio/autotest/**'
    }
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'GTNH Maven'
        url = 'https://nexus.gtnewhorizons.com/repository/public/'
    }
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    mavenCentral()
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand 'modVersion': project.version
    }
}
